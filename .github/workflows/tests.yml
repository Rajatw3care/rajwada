name: tests

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: mbstring, pdo, pdo_sqlite, gd, xml, bcmath, curl, zip
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: php artisan test --log-junit=storage/logs/test-report.xml

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        if: always()
        run: pip install openpyxl

      - name: Build pass/fail Excel report
        if: always()
        run: python .github/scripts/build_test_report.py storage/logs/test-report.xml storage/logs/rajwada-test-report.xlsx "$GITHUB_STEP_SUMMARY"

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: storage/logs/rajwada-test-report.xlsx
          retention-days: 30
